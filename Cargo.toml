[package]
name = "code-reviewer"
version = "0.4.7"
edition = "2021"
description = "Keyboard-driven TUI for reviewing GitHub PRs"
repository = "https://github.com/sumsar01/code-reviewer"

[lib]
name = "code_reviewer"
path = "src/lib.rs"

[[bin]]
name = "prr"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.29"

# Syntax highlighting
tree-sitter-highlight = "0.26"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-toml-ng = "0.7"

# GitHub API
octocrab = "0.49"
bytes = "1"
http = "1"
http-body-util = "0.1"

# Async
tokio = { version = "1", features = ["full"] }

# Git repo detection
git2 = "0.20"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Open in browser
open = "5"

# Directories (config, home)
dirs-next = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# HTTP for unauthenticated update check
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
