[package]
name = "code-reviewer"
version = "0.1.0"
edition = "2021"
description = "Keyboard-driven TUI for reviewing GitHub PRs"

[[bin]]
name = "prr"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.29"

# GitHub API
octocrab = "0.49"

# Async
tokio = { version = "1", features = ["full"] }

# Git repo detection
git2 = "0.20"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Open in browser
open = "5"

# Directories (config, home)
dirs-next = "2"

# Error handling
anyhow = "1"
thiserror = "2"
